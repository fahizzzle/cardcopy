name: Build

on:
  push:
    branches: [main, mac]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - run: python -m pytest -q

  mac-app:
    name: CardCopy.app
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build, start once, package
        run: PYTHON=python bash scripts/build_mac.sh
      - uses: actions/upload-artifact@v7
        with:
          name: CardCopy-mac
          path: |
            dist/CardCopy-mac.dmg
            dist/CardCopy-mac.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: dist/screenshots/
          if-no-files-found: warn

  mac-preview:
    # A download link for trying the Mac app: the "mac-preview" pre-release, replaced on every push to mac.
    # A pre-release is never "latest", so the update check of installed copies (Windows and Mac) ignores it.
    name: Publish mac-preview
    needs: mac-app
    if: github.ref == 'refs/heads/mac' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CardCopy-mac
          path: dist
      - name: Replace the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete mac-preview --cleanup-tag --yes || true
          gh release create mac-preview dist/CardCopy-mac.dmg dist/CardCopy-mac.zip \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "CardCopy for Mac (preview)" \
            --notes "Test build of the Mac version from the mac branch ($(echo "$GITHUB_SHA" | cut -c1-7)). Apple silicon, macOS 13 or later.

          Open CardCopy-mac.dmg and drag CardCopy to Applications. The app is not notarized yet, so the first time macOS blocks it: open System Settings > Privacy & Security and choose Open Anyway."

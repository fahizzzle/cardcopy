name: Build

on:
  push:
    branches: [main, mac]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - run: python -m pytest -q

  mac-app:
    name: CardCopy.app
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build, start once, package
        run: PYTHON=python bash scripts/build_mac.sh
      - uses: actions/upload-artifact@v7
        with:
          name: CardCopy-mac
          path: |
            dist/CardCopy-mac.dmg
            dist/CardCopy-mac.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: dist/screenshots/
          if-no-files-found: warn
